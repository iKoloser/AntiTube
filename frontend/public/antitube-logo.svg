<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 72" width="340" height="72" fill="none">
  <defs>
    <linearGradient id="cyberCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff" />
      <stop offset="55%" stop-color="#39a7ff" />
      <stop offset="100%" stop-color="#1d6ff2" />
    </linearGradient>
    <linearGradient id="metalWhite" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#cfd8e3" />
    </linearGradient>
    <filter id="neonGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Emblem Group: Futuristic HUD Hexagon + Deconstructed Play/Slash -->
  <g transform="translate(36, 36)">
    <!-- Outer dashed HUD orbital ring -->
    <circle r="29" stroke="#39a7ff" stroke-opacity="0.32" stroke-width="1" stroke-dasharray="10 6 2 6" />
    <!-- Inner subtle ring -->
    <circle r="23" stroke="#00e5ff" stroke-opacity="0.2" stroke-width="0.8" stroke-dasharray="4 8" />

    <!-- Outer Wireframe Hexagon -->
    <polygon
      points="0,-25 21.65,-12.5 21.65,12.5 0,25 -21.65,12.5 -21.65,-12.5"
      fill="#070d17"
      fill-opacity="0.85"
      stroke="url(#cyberCyan)"
      stroke-width="1.5"
    />

    <!-- Corner HUD ticks -->
    <path d="M -26 -20 L -26 -26 L -20 -26" stroke="#39a7ff" stroke-opacity="0.55" stroke-width="1.2" />
    <path d="M 26 20 L 26 26 L 20 26" stroke="#39a7ff" stroke-opacity="0.55" stroke-width="1.2" />

    <!-- Futuristic Play Prism (split by anti-slash) -->
    <path
      d="M -8 -12 L 13 0 L -8 12 Z"
      fill="#39a7ff"
      fill-opacity="0.14"
      stroke="url(#metalWhite)"
      stroke-width="1.8"
      stroke-linejoin="round"
    />
    <!-- Inner core triangle -->
    <path
      d="M -3.5 -5.5 L 6 0 L -3.5 5.5 Z"
      fill="url(#cyberCyan)"
    />

    <!-- "ANTI" Cybernetic Vector Slash cutting through the Play icon -->
    <line x1="-13" y1="16" x2="11" y2="-16" stroke="#030508" stroke-width="4.5" stroke-linecap="round" />
    <line x1="-13" y1="16" x2="11" y2="-16" stroke="url(#cyberCyan)" stroke-width="2.2" stroke-linecap="round" filter="url(#neonGlow)" />

    <!-- Orbital node dots -->
    <circle cx="0" cy="-25" r="2" fill="#00e5ff" />
    <circle cx="21.65" cy="12.5" r="1.6" fill="#39a7ff" />
    <circle cx="-21.65" cy="12.5" r="1.6" fill="#39a7ff" />
  </g>

  <!-- Top HUD Micro-telemetry label -->
  <g transform="translate(80, 17)">
    <circle cx="3" cy="-3.5" r="2" fill="#00e5ff" />
    <text
      x="10"
      y="0"
      fill="#647080"
      font-family="'JetBrains Mono', 'Fira Mono', Consolas, monospace"
      font-size="8.5"
      font-weight="600"
      letter-spacing="2.8"
    >SYS // MEDIA.NODE</text>
  </g>

  <!-- Main Wordmark: ANTI + TUBE -->
  <g transform="translate(79, 49)">
    <text
      x="0"
      y="0"
      font-family="'JetBrains Mono', 'Fira Mono', 'Segoe UI', system-ui, sans-serif"
      font-size="28"
      font-weight="800"
      letter-spacing="2.5"
    >
      <tspan fill="url(#metalWhite)">ANTI</tspan><tspan fill="url(#cyberCyan)" filter="url(#neonGlow)">TUBE</tspan>
    </text>
  </g>

  <!-- Bottom Technical Accent Line + Brackets -->
  <g transform="translate(80, 57)">
    <line x1="0" y1="0" x2="188" y2="0" stroke="#162231" stroke-width="1" />
    <line x1="0" y1="0" x2="54" y2="0" stroke="url(#cyberCyan)" stroke-width="1.8" />
    <rect x="58" y="-1" width="6" height="2" fill="#39a7ff" fill-opacity="0.7" />
    <rect x="67" y="-1" width="3" height="2" fill="#39a7ff" fill-opacity="0.4" />
  </g>
</svg>
