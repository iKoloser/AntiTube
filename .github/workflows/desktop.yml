name: Escritorio (Windows)

on:
  push:
    branches: [desktop]
    tags: ["desktop-v*"]
    # Cambiar solo documentación no publica una versión nueva.
    paths-ignore: ["**.md", "docs/**"]
  pull_request:
    paths: ["desktop/**", "frontend/**", "backend/**", ".github/workflows/desktop.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Comprobar tipos
        run: pnpm typecheck

      - name: Compilar instalador
        run: pnpm --filter @antitube/desktop build

      - name: Subir instalador
        uses: actions/upload-artifact@v4
        with:
          name: AntiTube-windows-instalador
          path: desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Leer versión
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content desktop/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          "value=$version" >> $env:GITHUB_OUTPUT

      # Las notas incluyen el mensaje del último commit: la app las muestra al ofrecer la actualización.
      - name: Preparar notas de la release
        if: github.event_name == 'push'
        shell: bash
        run: |
          {
            echo "## Novedades"
            echo
            git log -1 --format=%B | grep -v -e '^Co-Authored-By:' -e '^Claude-Session:' | sed '/^$/N;/^\n$/D'
            echo
            echo "## Instalación"
            echo
            echo "1. Descarga \`AntiTube_${{ steps.version.outputs.value }}_x64-setup.exe\` y ejecútalo. No necesita permisos de administrador."
            echo "2. Si ya tienes AntiTube, puedes actualizar desde la propia app: Herramientas › Actualizar AntiTube."
            echo "3. Al abrir la app por primera vez, el asistente descarga yt-dlp y FFmpeg."
            echo
            echo "Windows puede avisar con SmartScreen porque el instalador no está firmado: pulsa «Más información» › «Ejecutar de todas formas»."
          } > release-notes.md

      # Cada push a la rama desktop publica (o actualiza) la release desktop-v<versión>.
      - name: Publicar release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-v${{ steps.version.outputs.value }}
          target_commitish: ${{ github.sha }}
          name: AntiTube Escritorio v${{ steps.version.outputs.value }}
          files: desktop/src-tauri/target/release/bundle/nsis/*.exe
          prerelease: true
          generate_release_notes: true
          body_path: release-notes.md
